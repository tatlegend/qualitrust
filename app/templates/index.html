<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Educational Qualifications Verification</title>
  <style>
    :root {
      --bg-color: #f5f7fb;
      --panel-bg: #ffffff;
      --text-color: #1f2937;
      --muted-text: #4b5563;
      --heading-color: #123456;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --button-bg: #123456;
      --button-text: #ffffff;
      --panel-border: #dfe3ea;
      --result-bg: #f4f4f4;
      --shadow: rgba(17, 24, 39, 0.08);
    }

    body.dark-theme {
      --bg-color: #111827;
      --panel-bg: #1f2937;
      --text-color: #f3f4f6;
      --muted-text: #d1d5db;
      --heading-color: #8ec5ff;
      --input-bg: #111827;
      --input-border: #374151;
      --button-bg: #60a5fa;
      --button-text: #0f172a;
      --panel-border: #374151;
      --result-bg: #0b1220;
      --shadow: rgba(15, 23, 42, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px 40px;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.2s ease, color 0.2s ease;
    }

    h1 { color: var(--heading-color); }
    p { color: var(--muted-text); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .theme-toggle {
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      width: auto;
      min-width: 120px;
    }

    input {
      padding: 8px;
      margin: 4px 0;
      width: 100%;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--input-border);
      border-radius: 6px;
    }

    button {
      padding: 8px;
      margin: 4px 0;
      width: 100%;
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .panel {
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      background: var(--panel-bg);
      box-shadow: 0 4px 10px var(--shadow);
    }

    #result, #retrieveResult, #searchResult, #regResult {
      margin-top: 14px;
      padding: 12px;
      border-radius: 6px;
      background: var(--result-bg);
      color: var(--text-color);
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
    }

    .verified { background: #d4edda !important; color: #155724 !important; font-family: Arial, sans-serif !important; }
    .revoked, .not_found { background: #f8d7da !important; color: #721c24 !important; font-family: Arial, sans-serif !important; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Educational Qualifications Verifications</h1>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">Dark mode</button>
  </div>
  <p>AI-enabled qualification verification platform (demo UI)</p>

  <div class="panel">
    <h3>1. Register a Qualification</h3>
    <input id="regName" placeholder="Holder name">
    <input id="regTitle" placeholder="Qualification title">
    <input id="regInstitution" placeholder="Institution">
    <input id="regDate" placeholder="Issue date (YYYY-MM-DD)">
    <input id="regCert" placeholder="Certificate number (e.g. UZ-2023-000451)">
    <button onclick="register()">Register</button>
    <div id="regResult"></div>
  </div>

  <div class="panel">
    <h3>2. Search Qualifications</h3>
    <input id="searchInput" placeholder="Search by name, institution or certificate number">
    <button onclick="search()">Search</button>
    <div id="searchResult"></div>
  </div>

  <div class="panel">
    <h3>3. Retrieve a Single Record</h3>
    <input id="retrieveInput" placeholder="Exact certificate number">
    <button onclick="retrieve()">Retrieve</button>
    <div id="retrieveResult"></div>
  </div>

  <div class="panel">
    <h3>4. Verify Authenticity</h3>
    <input id="certInput" placeholder="e.g. UZ-2023-000451">
    <button onclick="verify()">Verify</button>
    <div id="result"></div>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
      const darkMode = theme === 'dark';
      document.body.classList.toggle('dark-theme', darkMode);
      themeToggle.textContent = darkMode ? 'Light mode' : 'Dark mode';
      localStorage.setItem('theme', theme);
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
    }

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
      applyTheme(nextTheme);
    });

    initializeTheme();

    async function register() {
      const payload = {
        holder_name: document.getElementById('regName').value,
        qualification_title: document.getElementById('regTitle').value,
        institution: document.getElementById('regInstitution').value,
        issue_date: document.getElementById('regDate').value,
        certificate_number: document.getElementById('regCert').value,
      };
      const res = await fetch('/api/qualifications', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('regResult').innerText = JSON.stringify(data);
    }

    async function search() {
      const q = document.getElementById('searchInput').value;
      const res = await fetch('/api/qualifications?q=' + encodeURIComponent(q));
      const data = await res.json();
      document.getElementById('searchResult').innerText = JSON.stringify(data, null, 2);
    }

    async function retrieve() {
      const cert = document.getElementById('retrieveInput').value;
      const res = await fetch('/api/qualifications/' + encodeURIComponent(cert));
      const data = await res.json();
      document.getElementById('retrieveResult').innerText = JSON.stringify(data, null, 2);
    }

    async function verify() {
      const cert = document.getElementById('certInput').value;
      const res = await fetch('/api/verify/' + encodeURIComponent(cert));
      const data = await res.json();
      const div = document.getElementById('result');
      div.className = data.result ? data.result.toLowerCase() : '';
      div.innerText = data.message;
    }
  </script>
</body>
</html>
